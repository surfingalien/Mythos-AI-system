[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mythos-ai-system"
version = "2.0.0"
description = "Voice assistant with an LLM tool-calling brain, wake word, and modern TTS/STT"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# LLM brain (tool calling, streaming)
llm = ["openai>=1.30.0"]
# Microphone + speech + wake word + neural TTS
audio = [
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.13",
    "pyttsx3>=2.90",
    "edge-tts>=6.1.0",
    "openwakeword>=0.6.0",
    "numpy>=1.24",
]
# Local speech-to-text
whisper = ["faster-whisper>=1.0.0", "numpy>=1.24"]
# Classic command integrations
commands = [
    "wikipedia>=1.4.0",
    "googlesearch-python>=1.2.3",
    "pywhatkit>=5.4",
]
web = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12.0"]
spotify = ["spotipy>=2.23"]
mcp = ["mcp>=1.0.0"]
# Windows system controls
windows = [
    'pycaw>=20230407; platform_system == "Windows"',
    'comtypes>=1.2.0; platform_system == "Windows"',
    'screen-brightness-control>=0.23.0; platform_system == "Windows"',
]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = [
    "mythos-ai-system[llm,audio,whisper,commands,web,spotify,windows]",
]

[project.scripts]
mythos = "mythos.__main__:main"

[tool.setuptools.packages.find]
include = ["mythos*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",  # function call in default argument (FastAPI style)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
